      <stop offset="0%" stop-color="#11182B"/>
      <stop offset="100%" stop-color="#0A0E18"/>
    </linearGradient>
    <linearGradient id="discordBtn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5865F2"/>
      <stop offset="100%" stop-color="#4752C4"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="878" height="148" rx="14" fill="url(#connBg)" stroke="#232F48" stroke-width="1.5"/>

  <g transform="translate(0, 32)">
