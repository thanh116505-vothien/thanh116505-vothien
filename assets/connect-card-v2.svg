        <rect width="200" height="48" rx="8" fill="#0E7490" fill-opacity="0.35" stroke="#06B6D4" stroke-width="1.2"/>
        <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#67E8F9" x="100" y="30" text-anchor="middle">📨 Liên hệ &amp; DM</text>
