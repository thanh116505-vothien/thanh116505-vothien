        <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#E2E8F0" x="107" y="30" text-anchor="middle">💻 Xem thêm dự án</text>
      </g>
    </a>

    <!-- DM / Contact Button -->
