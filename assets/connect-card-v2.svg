      <g transform="translate(0, 0)">
        <rect width="225" height="48" rx="8" fill="url(#discordBtn)" stroke="#7289DA" stroke-width="1.2"/>
        <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" x="112" y="30" text-anchor="middle">💬 Tham gia Discord</text>
      </g>
