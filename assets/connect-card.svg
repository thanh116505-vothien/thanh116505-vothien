        <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#E2E8F0" x="100" y="26" text-anchor="middle">💻 Xem thêm dự án</text>
      </g>
