    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8" x="440" y="24" text-anchor="middle">Cùng trao đổi về Game Modding, Reverse Engineering, AI Agent và C++ Systems!</text>
  </g>

  <!-- Buttons Row -->
  <g transform="translate(130, 85)">
