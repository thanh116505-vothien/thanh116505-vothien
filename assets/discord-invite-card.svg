<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 160" width="880" height="160" fill="none">
  <defs>
    <linearGradient id="disc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12161E"/>
      <stop offset="60%" stop-color="#0B0D12"/>
      <stop offset="100%" stop-color="#07090C"/>
    </linearGradient>
    <linearGradient id="disc-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F3E5AB"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA8232"/>
    </linearGradient>
    <linearGradient id="disc-btn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5865F2"/>
      <stop offset="100%" stop-color="#4752C4"/>
    </linearGradient>
    <filter id="disc-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Plate -->
  <rect width="880" height="160" rx="10" fill="url(#disc-bg)"/>
  <rect x="1" y="1" width="878" height="158" rx="9" stroke="url(#disc-gold)" stroke-width="1.2" stroke-opacity="0.6"/>
  <rect x="6" y="6" width="868" height="148" rx="6" stroke="#8C6B32" stroke-width="0.8" stroke-dasharray="8 6" stroke-opacity="0.3"/>

  <!-- Subtle Dong Son Concentric Rings in background -->
  <g transform="translate(100, 80)" opacity="0.08" stroke="#D4AF37" stroke-width="1.2">
    <circle cx="0" cy="0" r="110"/>
    <circle cx="0" cy="0" r="80" stroke-dasharray="4 4"/>
    <circle cx="0" cy="0" r="50"/>
  </g>

  <!-- Discord Glow Circle -->
  <circle cx="76" cy="80" r="42" fill="#5865F2" fill-opacity="0.12" filter="url(#disc-glow)"/>
  <circle cx="76" cy="80" r="36" fill="#151922" stroke="#5865F2" stroke-width="1.5"/>

  <!-- Discord Logo Vector -->
  <path d="M91.8 65.5C86.7 63.2 81.3 61.5 75.6 60.5C75 61.6 74.2 63.2 73.7 64.4C67.8 63.5 61.8 63.5 56 64.4C55.4 63.2 54.7 61.6 54 60.5C48.3 61.5 42.9 63.2 37.8 65.5C27.5 80.8 24.7 95.8 26.1 110.5C32.9 115.5 39.5 118.6 46 120.6C47.6 118.4 49 116.1 50.3 113.6C47.9 112.7 45.7 111.5 43.6 110.1C44.2 109.7 44.7 109.2 45.3 108.8C58.1 114.7 72 114.7 84.7 108.8C85.3 109.2 85.8 109.7 86.4 110.1C84.3 111.5 82.1 112.7 79.7 113.6C81 116.1 82.4 118.4 84 120.6C90.5 118.6 97.1 115.5 103.9 110.5C105.5 93.6 101.1 78.8 91.8 65.5ZM47.2 99.4C43.3 99.4 40.1 95.8 40.1 91.4C40.1 87 43.2 83.4 47.2 83.4C51.2 83.4 54.4 87 54.3 91.4C54.3 95.8 51.2 99.4 47.2 99.4ZM82.8 99.4C78.9 99.4 75.7 95.8 75.7 91.4C75.7 87 78.8 83.4 82.8 83.4C86.8 83.4 90 87 89.9 91.4C89.9 95.8 86.8 99.4 82.8 99.4Z" 
        fill="#5865F2" transform="translate(11, -11) scale(0.85)"/>

  <!-- Live Pulse Dot -->
  <circle cx="132" cy="45" r="4" fill="#00C896"/>
  <circle cx="132" cy="45" r="7" stroke="#00C896" stroke-width="1.2" opacity="0.6"/>

  <!-- Badge Text -->
  <text x="146" y="49" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600" fill="#00C896" letter-spacing="1">
    OFFICIAL DISCORD COMMUNITY · ONLINE
  </text>

  <!-- Main Headline -->
  <text x="132" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="url(#disc-gold)" letter-spacing="0.3">
    Kết nối cùng Vô Thiên trên Discord
  </text>

  <!-- Subtitle -->
  <text x="132" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#B9B2A3">
    Game Localization &amp; Modding · Reverse Engineering · Hệ thống AI Agent &amp; C++ Systems
  </text>

  <text x="132" y="126" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#D4AF37">
    discord.gg/pW86HytX <tspan fill="#6E7681">· Tag:</tspan> <tspan fill="#EAE4D8">vothien0143</tspan>
  </text>

  <!-- Right Call To Action Button -->
  <g transform="translate(670, 56)">
    <!-- Button Glow -->
    <rect width="180" height="48" rx="8" fill="#5865F2" fill-opacity="0.2" filter="url(#disc-glow)"/>
    <!-- Button Body -->
    <rect width="180" height="48" rx="8" fill="url(#disc-btn)"/>
    <rect x="1" y="1" width="178" height="46" rx="7" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1"/>
    
    <!-- Button Label -->
    <text x="90" y="30" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">
      THAM GIA NGAY ➜
    </text>
  </g>
</svg>
