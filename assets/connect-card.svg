        <rect width="210" height="42" rx="8" fill="url(#discordBtn)" stroke="#7289DA" stroke-width="1"/>
        <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" x="105" y="26" text-anchor="middle">💬 Tham gia Discord</text>
