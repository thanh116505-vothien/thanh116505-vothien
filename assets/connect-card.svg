        <rect width="180" height="42" rx="8" fill="#0E7490" fill-opacity="0.3" stroke="#06B6D4" stroke-width="1"/>
        <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#67E8F9" x="90" y="26" text-anchor="middle">📨 Liên hệ &amp; DM</text>
