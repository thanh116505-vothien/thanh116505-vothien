<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 175" width="880" height="175">
  <defs>
    <linearGradient id="connBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#11182B"/>
      <stop offset="100%" stop-color="#0A0E18"/>
    </linearGradient>
    <linearGradient id="discordBtn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5865F2"/>
      <stop offset="100%" stop-color="#4752C4"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="878" height="173" rx="14" fill="url(#connBg)" stroke="#232F48" stroke-width="1.5"/>

  <g transform="translate(0, 38)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#D4AF37" x="440" y="0" text-anchor="middle">🤝 Kết Nối &amp; Trao Đổi Kỹ Thuật</text>
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="500" fill="#CBD5E1" x="440" y="28" text-anchor="middle">Cùng trao đổi về Game Modding, Reverse Engineering, AI Agent và C++ Systems!</text>
  </g>

  <!-- Buttons Row with Large 16px Text -->
  <g transform="translate(100, 100)">
